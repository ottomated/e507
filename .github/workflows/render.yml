name: Render Schematic
on:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create token
        id: create_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.create_token.outputs.token }}
          persist-credentials: true
      
      - name: Run KiCad
        run: |
          docker run --rm \
            -v "$PWD:/project" -w /project \
            --user "$(id -u):$(id -g)" \
            kicad/kicad:10.0-full \
            sh -c '
              kicad-cli sch export svg -o images ./e507.kicad_sch
              kicad-cli pcb export svg -o images/pcb.svg -l "F.Cu,In2.Cu,B.Cu,F.Paste,B.Paste,Edge.Cuts,F.Courtyard,B.Courtyard,F.Mask,B.Mask" --mode-single ./e507.kicad_pcb
              kicad-cli pcb render -o images/pcb.png --side top --rotate -45,0,45 --width 800 --height 800 ./e507.kicad_pcb
            '
      
      - name: Push images
        run: |
          git config --local user.email "ottomated@users.noreply.github.com"
          git config --local user.name "kicad[bot]"


          git add images
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update images [skip ci]"
          git push origin main

