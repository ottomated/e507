name: Render Schematic
on:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install KiCad
        uses: actions-for-kicad/kicad-actions@ac5e6d742e3eef663cfc21cac30d37384d71fb7a # v2.7-k10.0.7
        with:
          schematic_file_name: ./power.kicad_sch
          schematic_output_svg: true
          schematic_output_svg_folder_name: schematics
